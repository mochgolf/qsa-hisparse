class="label">after fix</text><rect x="665" y="301" width="420" height="38" rx="6" fill="#edf0f5"/><rect x="665" y="301" width="402.0" height="38" rx="6" fill="#e45756"/><text x="1105" y="327" class="value" text-anchor="end">14.356 ms</text><text x="665" y="405" class="big" fill="#e45756">+0.0125 ms/token</text><text x="665" y="438" class="label">+0.087% TPOT · −0.088% rate</text><text x="665" y="481" class="small">The API mechanism changed exactly as intended,</text><text x="665" y="503" class="small">but the measured critical path did not improve.</text><text x="50" y="610" class="tiny">Service TPOT is the mean of matched before/after windows; native outputs vary, so this is descriptive performance evidence.</text></svg>
