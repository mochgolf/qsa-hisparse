<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" role="img" aria-labelledby="title desc" viewBox="0 0 1280 680"><title id="title">NSYS decode gap: 38.8 tok/s was not an offload floor</title><desc id="desc">Stacked profile-cycle decomposition for deterministic and native-math B1 comparisons on the same 4094-token prompt shape.</desc><rect width="100%" height="100%" fill="#f7f8fb"/><style>
text{font-family:Inter,system-ui,-apple-system,"Noto Sans CJK SC",sans-serif;fill:#172033}
.title{font-size:28px;font-weight:700}.subtitle{font-size:15px;fill:#5c667a}.label{font-size:14px}.small{font-size:12px;fill:#5c667a}.tiny{font-size:10px;fill:#6b7487}.value{font-size:14px;font-weight:700}.big{font-size:25px;font-weight:750}.axis{stroke:#aab2c3;stroke-width:1}.grid{stroke:#e8ebf1;stroke-width:1}.card{fill:#fff;stroke:#d9deea;stroke-width:1.5}
</style><text x="50" y="50" class="title">NSYS decode gap: 38.8 tok/s was not an offload floor</text><text x="50" y="77" class="subtitle">B1 · 4,094-token input · no MTP · Full CUDA Graph · values average the two TP ranks</text><rect x="50" y="112" width="810" height="500" rx="14" class="card"/><text x="78" y="150" class="value">Mean traced cycle</text><line x1="280.0" y1="170" x2="280.0" y2="550" class="grid"/><text x="280.0" y="575" class="small" text-anchor="middle">0 ms</text><line x1="369.2" y1="170" x2="369.2" y2="550" class="grid"/><text x="369.2" y="575" class="small" text-anchor="middle">5 ms</text><line x1="458.3" y1="170" x2="458.3" y2="550" class="grid"/><text x="458.3" y="575" class="small" text-anchor="middle">10 ms</text><line x1="547.5" y1="170" x2="547.5" y2="550" class="grid"/><text x="547.5" y="575" class="small" text-anchor="middle">15 ms</text><line x1="636.7" y1="170" x2="636.7" y2="550" class="grid"/><text x="636.7" y="575" class="small" text-anchor="middle">20 ms</text><line x1="725.8" y1="170" x2="725.8" y2="550" class="grid"/><text x="725.8" y="575" class="small" text-anchor="middle">25 ms</text><line x1="815.0" y1="170" x2="815.0" y2="550" class="grid"/><text x="815.0" y="575" class="small" text-anchor="middle">30 ms</text><text x="78" y="212" class="label">deterministic · original</text><rect x="280" y="190" width="417.1" height="34" rx="5" fill="#7f91c9"/><rect x="697.1" y="190" width="32.1" height="34" rx="5" fill="#e9a23b"/><text x="488.5" y="213" text-anchor="middle" style="fill:#fff;font-size:12px;font-weight:650">GPU 23.388</text><text x="738.2" y="213" class="value">25.191</text><text x="78" y="298" class="label">deterministic · candidate</text><rect x="280" y="276" width="421.9" height="34" rx="5" fill="#4867d6"/><rect x="701.9" y="276" width="45.6" height="34" rx="5" fill="#e9a23b"/><text x="490.9" y="299" text-anchor="middle" style="fill:#fff;font-size:12px;font-weight:650">GPU 23.657</text><text x="756.5" y="299" class="value">26.214</text><text x="78" y="384" class="label">native · original</text><rect x="280" y="362" width="218.4" height="34" rx="5" fill="#e9b16f"/><rect x="498.4" y="362" width="50.9" height="34" rx="5" fill="#e9a23b"/><text x="389.2" y="385" text-anchor="middle" style="fill:#fff;font-size:12px;font-weight:650">GPU 12.245</text><text x="558.3" y="385" class="value">15.115</text><text x="78" y="470" class="label">native · candidate</text><rect x="280" y="448" width="222.4" height="34" rx="5" fill="#e45756"/><rect x="502.4" y="448" width="65.8" height="34" rx="5" fill="#e9a23b"/><text x="391.2" y="471" text-anchor="middle" style="fill:#fff;font-size:12px;font-weight:650">GPU 12.472</text><text x="577.2" y="471" class="value">16.160</text><rect x="280" y="515" width="14" height="14" rx="2" fill="#4867d6"/><text x="302" y="527" class="small">device-work union</text><rect x="445" y="515" width="14" height="14" rx="2" fill="#e9a23b"/><text x="467" y="527" class="small">host/inter-graph residual</text><rect x="885" y="112" width="345" height="226" rx="14" class="card"/><text x="915" y="150" class="value">Why deterministic was slow</text><text x="915" y="195" class="big" fill="#e45756">255 calls/token</text><text x="915" y="224" class="label">persistent GEMM · ~19.8 ms raw sum</text><text x="915" y="252" class="small">Native math removes this kernel.</text><text x="915" y="288" class="value">40.23 → 74.57 tok/s</text><text x="915" y="313" class="small">original service mean, deterministic → native</text><rect x="885" y="362" width="345" height="250" rx="14" class="card"/><text x="915" y="400" class="value">Candidate overhead under native math</text><text x="915" y="449" class="big" fill="#e45756">+1.045 ms/cycle</text><text x="915" y="482" class="label">GPU union +0.227 ms</text><text x="915" y="509" class="label">residual +0.833 ms</text><text x="915" y="548" class="small">Most of the remaining profile delta sat</text><text x="915" y="568" class="small">outside measured device work.</text><text x="50" y="655" class="tiny">Native-math outputs were replay-dependent; those arms are descriptive performance evidence, not an exact-output correctness result.</text></svg>
