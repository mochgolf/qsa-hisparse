<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="600" role="img" aria-labelledby="title desc" viewBox="0 0 1050 600">
<title id="title">QSA hot-cache replay</title><desc id="desc">Bar chart showing lower miss rates as cache size grows from one to eight times the selected working set.</desc>
<rect width="100%" height="100%" fill="#f7f8fb"/><style>
text{font-family:Inter,system-ui,-apple-system,"Noto Sans CJK SC",sans-serif;fill:#172033}
.title{font-size:28px;font-weight:700}.subtitle{font-size:15px;fill:#5c667a}.label{font-size:14px}.small{font-size:12px;fill:#5c667a}.value{font-size:13px;font-weight:650}.axis{stroke:#aab2c3;stroke-width:1}.grid{stroke:#e8ebf1;stroke-width:1}.card{fill:#fff;stroke:#d9deea;stroke-width:1.5}.arrow{stroke:#4867d6;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4867d6"/></marker></defs><text x="50" y="50" class="title">CPU replay: hot-cache size versus miss demand</text><text x="50" y="76" class="subtitle">Same 38K trace · first selection preloaded · 12 layers summed per decode token</text><line x1="90" y1="500.0" x2="990" y2="500.0" class="grid"/><text x="76" y="505.0" class="small" text-anchor="end">0%</text><line x1="90" y1="401.2" x2="990" y2="401.2" class="grid"/><text x="76" y="406.2" class="small" text-anchor="end">10%</text><line x1="90" y1="302.5" x2="990" y2="302.5" class="grid"/><text x="76" y="307.5" class="small" text-anchor="end">20%</text><line x1="90" y1="203.8" x2="990" y2="203.8" class="grid"/><text x="76" y="208.8" class="small" text-anchor="end">30%</text><line x1="90" y1="105.0" x2="990" y2="105.0" class="grid"/><text x="76" y="110.0" class="small" text-anchor="end">40%</text><rect x="90.0" y="168.6" width="105" height="331.4" rx="7" fill="#4867d6"/><text x="142.5" y="158.6" class="value" text-anchor="middle">33.56%</text><text x="142.5" y="528" font-size="16" font-weight="700" text-anchor="middle">1×</text><text x="142.5" y="551" class="small" text-anchor="middle">4.028 MiB/token/rank</text><rect x="288.8" y="336.4" width="105" height="163.6" rx="7" fill="#4867d6"/><text x="341.2" y="326.4" class="value" text-anchor="middle">16.56%</text><text x="341.2" y="528" font-size="16" font-weight="700" text-anchor="middle">2×</text><text x="341.2" y="551" class="small" text-anchor="middle">1.988 MiB/token/rank</text><rect x="487.5" y="398.2" width="105" height="101.8" rx="7" fill="#4867d6"/><text x="540.0" y="388.2" class="value" text-anchor="middle">10.31%</text><text x="540.0" y="528" font-size="16" font-weight="700" text-anchor="middle">3×</text><text x="540.0" y="551" class="small" text-anchor="middle">1.237 MiB/token/rank</text><rect x="686.2" y="429.8" width="105" height="70.2" rx="7" fill="#2a9d78"/><text x="738.8" y="419.8" class="value" text-anchor="middle">7.11%</text><text x="738.8" y="528" font-size="16" font-weight="700" text-anchor="middle">4×</text><text x="738.8" y="551" class="small" text-anchor="middle">0.853 MiB/token/rank</text><rect x="885.0" y="476.2" width="105" height="23.8" rx="7" fill="#4867d6"/><text x="937.5" y="466.2" class="value" text-anchor="middle">2.41%</text><text x="937.5" y="528" font-size="16" font-weight="700" text-anchor="middle">8×</text><text x="937.5" y="551" class="small" text-anchor="middle">0.290 MiB/token/rank</text><text x="525" y="580" class="subtitle" text-anchor="middle">4× was selected: +24 MiB/request/rank over 2×, with about 57% less mean miss demand.</text></svg>
