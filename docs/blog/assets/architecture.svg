<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="740" role="img" aria-labelledby="title desc" viewBox="0 0 1280 740">
<title id="title">QSA HiSparse architecture</title><desc id="desc">The GPU retains the full index and recurrent state, shares one prefill staging arena, and gives each decode request a bounded hot cache. Full raw C4 KV history lives in NUMA-local pinned host memory.</desc>
<rect width="100%" height="100%" fill="#f7f8fb"/><style>
text{font-family:Inter,system-ui,-apple-system,"Noto Sans CJK SC",sans-serif;fill:#172033}
.title{font-size:28px;font-weight:700}.subtitle{font-size:15px;fill:#5c667a}.label{font-size:14px}.small{font-size:12px;fill:#5c667a}.value{font-size:13px;font-weight:650}.axis{stroke:#aab2c3;stroke-width:1}.grid{stroke:#e8ebf1;stroke-width:1}.card{fill:#fff;stroke:#d9deea;stroke-width:1.5}.arrow{stroke:#4867d6;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4867d6"/></marker></defs>
<text x="50" y="52" class="title">QSA HiSparse: logical history, bounded GPU residency</text>
<text x="50" y="79" class="subtitle">One shared prefill lane; up to eight independent decode leases</text>
<rect x="45" y="110" width="745" height="580" rx="18" fill="#eef3ff" stroke="#9db2f4" stroke-width="2"/>
<text x="70" y="145" font-size="20" font-weight="700" fill="#2947a9">GPU per TP rank</text>
<rect x="75" y="175" width="300" height="105" rx="12" class="card"/>
<text x="95" y="208" font-size="17" font-weight="700">Full logical index</text>
<text x="95" y="234" class="label">QSA BF16 index keys · 192 MiB/request</text>
<text x="95" y="258" class="small">Always resident; preserves every selectable position</text>
<rect x="430" y="175" width="300" height="105" rx="12" class="card"/>
<text x="450" y="208" font-size="17" font-weight="700">GDN recurrent state</text>
<text x="450" y="234" class="label">About 55 MiB/live request</text>
<text x="450" y="258" class="small">Not offloaded; 40-slot pool stays on device</text>
<rect x="75" y="330" width="300" height="125" rx="12" fill="#fff5e8" stroke="#efb462" stroke-width="1.5"/>
<text x="95" y="363" font-size="17" font-weight="700">Shared prefill staging</text>
<text x="95" y="389" class="label">One 262,144-token raw arena</text>
<text x="95" y="413" class="small">Only one prefill owns it at a time</text>
<text x="95" y="435" class="small">C4 pack and asynchronous D2H handoff</text>
<rect x="430" y="330" width="300" height="125" rx="12" fill="#e9fbf4" stroke="#65bf94" stroke-width="1.5"/>
<text x="450" y="363" font-size="17" font-weight="700">Per-request hot working set</text>
<text x="450" y="389" class="label">2,048 C4 blocks/layer + padding</text>
<text x="450" y="413" class="small">LRU resolve · misses fetched from host</text>
<text x="450" y="435" class="small">Five-row tail ring keeps incomplete C4</text>
<rect x="250" y="520" width="330" height="115" rx="12" fill="#f3edff" stroke="#9b79da" stroke-width="1.5"/>
<text x="275" y="554" font-size="17" font-weight="700">Decode critical path</text>
<text x="275" y="580" class="label">top-k blocks → indexed unpack → ragged FA2</text>
<text x="275" y="606" class="small">New K/V stays visible immediately, then writes back</text>
<rect x="835" y="110" width="400" height="580" rx="18" fill="#fff7ed" stroke="#edb678" stroke-width="2"/>
<text x="860" y="145" font-size="20" font-weight="700" fill="#9a5311">CPU NUMA-local pinned memory</text>
<rect x="875" y="210" width="320" height="170" rx="12" class="card"/>
<text x="900" y="246" font-size="18" font-weight="700">Full raw C4 K/V history</text>
<text x="900" y="276" class="label">1.5 GiB/request/rank at 256K</text>
<text x="900" y="302" class="label">B8: 12 GiB/rank</text>
<text x="900" y="330" class="small">Independent K/V bytes and FP8 scales</text>
<text x="900" y="352" class="small">Rank 0 → NUMA 3 · rank 1 → NUMA 2</text>
<rect x="875" y="455" width="320" height="125" rx="12" class="card"/>
<text x="900" y="491" font-size="18" font-weight="700">Request lifecycle ledger</text>
<text x="900" y="520" class="label">lease + generation + logical row</text>
<text x="900" y="546" class="small">drain → logical flush → physical release</text>
<path d="M 375 392 C 560 285, 720 285, 875 285" class="arrow"/>
<text x="585" y="292" class="small">pack / D2H</text>
<path d="M 875 340 C 770 430, 770 392, 730 392" class="arrow"/>
<text x="760" y="410" class="small">miss fetch</text>
<path d="M 580 455 C 560 485, 520 505, 500 520" class="arrow"/>
<path d="M 415 520 C 395 495, 375 480, 340 455" class="arrow"/>
<path d="M 580 578 C 720 620, 800 600, 875 545" class="arrow"/>
<text x="710" y="627" class="small">new C4 writeback / release</text>
</svg>
